name: Daily Sync Apple Platform Security Guide

on:
  schedule:
    # Run daily at 09:41 UTC (iPhone launch homage, off the hour)
    - cron: '41 9 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-add even if the content is already tracked'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download current Apple Platform Security Guide
        run: |
          URL="https://help.apple.com/pdf/security/en_US/apple-platform-security-guide.pdf"
          TARGET_DIR="/tmp/apple-guide"
          TARGET_FILE="$TARGET_DIR/current.pdf"
          mkdir -p "$TARGET_DIR"
          curl -fsSL -o "$TARGET_FILE" "$URL"
          echo "URL=$URL"
          echo "TARGET_DIR=$TARGET_DIR"
          echo "TARGET_FILE=$TARGET_FILE"

      - name: Compute sha256 of downloaded PDF
        id: hash
        run: |
          TARGET_FILE="/tmp/apple-guide/current.pdf"
          sha=$(sha256sum "$TARGET_FILE" | awk '{print $1}')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "TARGET_FILE=$TARGET_FILE"
          echo "sha=$sha"

      - name: Check whether the sha256 already exists in CHECKSUMS.txt
        id: check
        env:
          CURRENT_SHA: ${{ steps.hash.outputs.sha }}
        run: |
          CHECKSUMS="Apple_Platform_Security_Guide/CHECKSUMS.txt"
          if [ -f "$CHECKSUMS" ] && grep -q "$CURRENT_SHA" "$CHECKSUMS"; then
            # Content already tracked -> nothing to add (unless forced)
            found="true"
          else
            found="false"
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"
          echo "CURRENT_SHA=$CURRENT_SHA"
          echo "CHECKSUMS=$CHECKSUMS"
          echo "found=$found"

      - name: Determine filename and stage new guide + checksum + README update
        if: steps.check.outputs.found == 'false' || inputs.force
        id: stage
        run: |
          set -euo pipefail
          DIR="Apple_Platform_Security_Guide"
          CHECKSUMS="$DIR/CHECKSUMS.txt"
          README="README.md"
          mkdir -p "$DIR"

          # 1) Name the new file using the current year-month, matching existing convention
          date_str=$(date -u +%Y-%B)
          dest="${DIR}/${date_str}-apple-platform-security-guide.pdf"
          if [ -e "$dest" ]; then
            base="${dest%.pdf}"
            n=2
            while [ -e "${base}-${n}.pdf" ]; do n=$((n+1)); done
            dest="${base}-${n}.pdf"
          fi
          cp /tmp/apple-guide/current.pdf "$dest"

          # 2) Append the new checksum entry
          sha=$(sha256sum /tmp/apple-guide/current.pdf | awk '{print $1}')
          basename "$dest" > /tmp/newname.txt
          echo "$sha  $(basename "$dest")" >> "$CHECKSUMS"

          # 3) Recompute the repo-wide PDF count and the latest guide year
          pdf_count=$(find . -type f -name '*.pdf' | wc -l | tr -d ' ')
          latest_year=$(ls "$DIR"/*.pdf | sed -E 's#.*/##' | grep -oE '^[0-9]{4}' | sort -u | tail -1)
          echo "pdf_count=$pdf_count" >> "$GITHUB_OUTPUT"
          echo "latest_year=$latest_year" >> "$GITHUB_OUTPUT"
          echo "dest=$dest" >> "$GITHUB_OUTPUT"

          echo "DIR=$DIR"
          echo "CHECKSUMS=$CHECKSUMS"
          echo "README=$README"
          echo "date_str=$date_str"
          echo "dest=$dest"
          echo "sha=$sha"
          echo "pdf_count=$pdf_count"
          echo "latest_year=$latest_year"

      - name: Update root README counts and year range
        if: steps.check.outputs.found == 'false' || inputs.force
        id: readme
        env:
          PDF_COUNT: ${{ steps.stage.outputs.pdf_count }}
          LATEST_YEAR: ${{ steps.stage.outputs.latest_year }}
        run: |
          set -euo pipefail
          README="README.md"

          # Update "**N PDF documents** currently tracked"
          sed -i -E "s/- \*\*[0-9]+ PDF documents\*\* currently tracked/- **${PDF_COUNT} PDF documents** currently tracked/" "$README"

          # Update the year range "from **YYYY–YYYY**" in the Collections table
          sed -i -E "s/editions from \*\*[0-9]{4}–[0-9]{4}\*\*/editions from **2019–${LATEST_YEAR}**/" "$README"

          updated="true"
          echo "updated=$updated" >> "$GITHUB_OUTPUT"
          echo "README=$README"
          echo "PDF_COUNT=$PDF_COUNT"
          echo "LATEST_YEAR=$LATEST_YEAR"
          echo "updated=$updated"

      - name: Commit and push changes
        if: steps.check.outputs.found == 'false' || inputs.force
        env:
          DEST: ${{ steps.stage.outputs.dest }}
        run: |
          CHECKSUMS="Apple_Platform_Security_Guide/CHECKSUMS.txt"
          README="README.md"
          COMMIT_MSG="docs(apple-platform-security): add ${DEST}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git add "$CHECKSUMS"
          git add "$README"
          if git diff --cached --quiet; then
            echo "DEST=$DEST"
            echo "CHECKSUMS=$CHECKSUMS"
            echo "README=$README"
            echo "COMMIT_MSG=$COMMIT_MSG"
            echo "has_changes=false"
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "$COMMIT_MSG"
          git push origin HEAD:master
          echo "DEST=$DEST"
          echo "CHECKSUMS=$CHECKSUMS"
          echo "README=$README"
          echo "COMMIT_MSG=$COMMIT_MSG"
          echo "has_changes=true"
